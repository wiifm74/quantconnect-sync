name: Compare QuantConnect and GitHub

on:
  workflow_dispatch:
  workflow_call:

jobs:
  compare:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Run compare
        env:
          QC_USER_ID: ${{ secrets.QC_USER_ID }}
          QC_API_TOKEN: ${{ secrets.QC_API_TOKEN }}
          PROJECT_ID: ${{ vars.QC_PROJECT_ID }}
        run: |
          python3 .github/scripts/qc_sync_logic.py compare

      - name: Commit compare report
        run: |
          PROJECT_DIR=$(python3 -c 'import json; print(json.load(open(".github/qc-sync-config.json"))["project_dir"])')

          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add "$PROJECT_DIR/.qc-compare-report.json"

          if git diff --cached --quiet; then
            echo "No report changes"
          else
            git commit -m "Update QC compare report"
            git push
          fi
